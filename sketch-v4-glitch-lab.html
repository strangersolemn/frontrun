  #toggle-panel {

  /* TITLE / FADE — for the promo video ending.
     #fade-black dissolves the tunnel to black; #title resolves the wordmark

  #fade-black {
    position: absolute; inset: 0; background: #000;

<!-- VERTEX SHADER for the tunnel -->
<script id="vs" type="x-shader/x-vertex">
attribute vec3 position;
attribute vec2 uv;
uniform mat4 uMVP;
uniform float uScroll;
varying vec2 vUv;
varying float vDepth;
void main() {
  vUv = uv;
  vUv.y += uScroll;
  vec4 pos = uMVP * vec4(position, 1.0);
  gl_Position = pos;
  vDepth = pos.z;
}
</script>

<!-- FRAGMENT SHADER for the tunnel -->
<script id="fs" type="x-shader/x-fragment">
precision mediump float;
uniform sampler2D uTexture;
uniform vec3 uFogColor;
uniform float uTime;
uniform float uGlitchAmount;
varying vec2 vUv;
varying float vDepth;
float hash11(float n) { return fract(sin(n) * 43758.5453123); }
void main() {
  vec2 uv = vUv;
  float band = floor(uv.y * 40.0);
  float bandHash = hash11(band + floor(uTime * 6.0));
  if (bandHash > 0.85) {
    float shift = (hash11(band * 7.31) - 0.5) * 0.15 * uGlitchAmount;
    uv.x += shift;
  }
  vec4 color = texture2D(uTexture, uv);
  float dist = abs(vDepth);
  float fogFactor = exp2(-0.045 * dist * dist);
  fogFactor = clamp(fogFactor, 0.0, 1.0);
  gl_FragColor = mix(vec4(uFogColor, 1.0), color, fogFactor);
  gl_FragColor.a = 1.0;
}
</script>

<!-- pretext (chenglou/pretext) — pure-JS multiline text measurement & layout,
     vendored & self-contained at vendor/pretext.js. Module loads deferred and
     assigns window.Pretext; the classic script below uses it (with a fallback)
     only inside the rAF render loop, by which time this has executed. -->
<script type="module">
  import * as Pretext from './vendor/pretext.js';
  window.Pretext = Pretext;
</script>

<script>
// ===========================================================================
// FRONTRUN GLITCH LAB v4
// 3-layer architecture: bottom glitch + figure (middle) + top glitch
// 30+ pure-Canvas glitch effects, layered + selectable per layer
// ===========================================================================
const $ = id => document.getElementById(id);

const fig = $('fig');
const fCtx = fig.getContext('2d');
const bgGl = $('bg-gl');
const gl = bgGl.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false });
if (!gl) console.warn('WebGL not available — tunnel will not render');

let W = 0, H = 0;
function resize() {
  W = Math.round(window.innerWidth);
  H = Math.round(window.innerHeight);
  fig.width = W; fig.height = H;
  { var _b2=document.getElementById("bg2d"); if(_b2){_b2.width=W;_b2.height=H;} }
  if (gl) {
    bgGl.width = W; bgGl.height = H;
    gl.viewport(0, 0, W, H);
    perspective(Math.PI / 2.2, W / H, 0.1, 50);
    if (uMVP && program) { gl.useProgram(program); gl.uniformMatrix4fv(uMVP, false, mvp); }
  }
}
window.addEventListener('resize', resize);

// ===========================================================================
// WEBGL TUNNEL setup (lifted from sketch-v3 — runs once at boot)
// ===========================================================================
function compileShader(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(sh));
    throw new Error('shader compile fail');
  }
  return sh;
}

let program = null;
let aPos, aUv, uMVP, uScroll, uTex, uFog, uTime, uGlitch;
let vbo, vertCount = 0;
let texture = null;
const Z_DEPTH = 12, TILE_REPEAT = 5;
const mvp = new Float32Array(16);

function perspective(fovY, aspect, near, far) {
  const f = 1 / Math.tan(fovY / 2);
  mvp[0]  = f / aspect; mvp[1]  = 0; mvp[2]  = 0; mvp[3]  = 0;
  mvp[4]  = 0;          mvp[5]  = f; mvp[6]  = 0; mvp[7]  = 0;
  mvp[8]  = 0;          mvp[9]  = 0;
  mvp[10] = (far + near) / (near - far);
  mvp[11] = -1;
  mvp[12] = 0;          mvp[13] = 0;
  mvp[14] = (2 * far * near) / (near - far);
  mvp[15] = 0;
}

function setupWebGL() {
  if (!gl) return;
  const vsSrc = document.getElementById('vs').textContent;
  const fsSrc = document.getElementById('fs').textContent;
  program = gl.createProgram();
  gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error('program link fail: ' + gl.getProgramInfoLog(program));
  }
  gl.useProgram(program);
  aPos    = gl.getAttribLocation(program, 'position');
  aUv     = gl.getAttribLocation(program, 'uv');
  uMVP    = gl.getUniformLocation(program, 'uMVP');
  uScroll = gl.getUniformLocation(program, 'uScroll');
  uTex    = gl.getUniformLocation(program, 'uTexture');
  uFog    = gl.getUniformLocation(program, 'uFogColor');
  uTime   = gl.getUniformLocation(program, 'uTime');
  uGlitch = gl.getUniformLocation(program, 'uGlitchAmount');
  vbo = gl.createBuffer();
  texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
}

function buildTunnelGeometry(shape) {
  if (!gl || !program) return;
  const N = shape.sides;
  const baseRot = shape.rot || 0;
  const twist = shape.twist || 0;
  const verts = [];
  for (let i = 0; i < N; i++) {
    const a0 = ((i)     / N) * Math.PI * 2 + baseRot;
    const a1 = ((i + 1) / N) * Math.PI * 2 + baseRot;
    const nx0 = Math.cos(a0), ny0 = Math.sin(a0);
    const nx1 = Math.cos(a1), ny1 = Math.sin(a1);
    const fa0 = a0 + twist, fa1 = a1 + twist;
    const fx0 = Math.cos(fa0), fy0 = Math.sin(fa0);
    const fx1 = Math.cos(fa1), fy1 = Math.sin(fa1);
    verts.push(nx0, ny0, 0,         0, 0);
    verts.push(fx0, fy0, -Z_DEPTH,  0, TILE_REPEAT);
    verts.push(nx1, ny1, 0,         1, 0);
    verts.push(nx1, ny1, 0,         1, 0);
    verts.push(fx0, fy0, -Z_DEPTH,  0, TILE_REPEAT);
    verts.push(fx1, fy1, -Z_DEPTH,  1, TILE_REPEAT);
  }
  const arr = new Float32Array(verts);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(aUv);
  gl.vertexAttribPointer(aUv,  2, gl.FLOAT, false, 20, 12);
  vertCount = arr.length / 5;
}

function hexBytes(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [(v>>16)&0xff, (v>>8)&0xff, v&0xff];
}

const TEX_SIZE = 256;
function buildTunnelTexture() {
  if (!gl || !program) return;
  const c = document.createElement('canvas');
  c.width = TEX_SIZE; c.height = TEX_SIZE;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(TEX_SIZE, TEX_SIZE);
  const data = img.data;
  const bgC     = hexBytes(palette[0]);
  const accent  = hexBytes(palette[1]);
  const mid     = hexBytes(palette[2]);
  const cell = 4;
  const density = 0.35;
  for (let by = 0; by < TEX_SIZE; by += cell) {
    for (let bx = 0; bx < TEX_SIZE; bx += cell) {
      const r = Math.random();
      let col;
      if (r < 0.55) col = bgC;
      else if (r < 0.55 + density) col = accent;
      else col = mid;
      for (let y = by; y < by + cell; y++) {
        for (let x = bx; x < bx + cell; x++) {
          const i = (y * TEX_SIZE + x) * 4;
          data[i] = col[0]; data[i+1] = col[1]; data[i+2] = col[2]; data[i+3] = 255;
        }
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
}

function hexRGB(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [((v>>16)&0xff)/255, ((v>>8)&0xff)/255, (v&0xff)/255];
}

// Tunnel state — initialized in boot after SHAPES/PALETTES are defined
let activeShape = null;
let tunnelTex = 'noise';            // which texture for tunnel walls

// Offscreen 256x256 canvas used to render the chosen glitch each frame,
// then upload to GPU as the wall texture.
const texCanvas = document.createElement('canvas');
texCanvas.width = TEX_SIZE; texCanvas.height = TEX_SIZE;
const texCtx = texCanvas.getContext('2d');

function updateTunnelTextureFromGlitch(t) {
  // Find the glitch fn — check curated GLITCHES first, then TUNNEL_TEX_EXTRA
  const g = GLITCHES.find(gl => gl.id === tunnelTex)
         || TUNNEL_TEX_EXTRA.find(gl => gl.id === tunnelTex);
  if (!g) return;
  g.fn(texCtx, TEX_SIZE, TEX_SIZE, palette, t, 0.6, 0.5, 1);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, texCanvas);
}

function drawTunnel(t) {
  if (!gl) return;
  if (activeShaderTunnel) { drawShaderTunnel(t); return; }
  if (!program || !vertCount) return;
  // re-bind every frame: the shader-tunnel pass owns its own program/buffers
  gl.useProgram(program);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(aUv);
  gl.vertexAttribPointer(aUv,  2, gl.FLOAT, false, 20, 12);
  // texture: noise = static one-time bake; glitch id = live re-render every frame
  if (tunnelTex !== 'noise') {
    updateTunnelTextureFromGlitch(t);
  }
  gl.uniform1i(uTex, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  const fog = hexRGB(palette[3] || '#0a0a14');
  gl.uniform3f(uFog, fog[0], fog[1], fog[2]);
  gl.uniform1f(uScroll, t * 0.4);
  gl.uniform1f(uTime, t);
  gl.uniform1f(uGlitch, 0.5);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, vertCount);
}

let stProg = {}, stBuf = null;
let glyphTex = null, addrTex = null, glyphAddr = null;
function buildGlyphAtlas(){
  const cw=24,ch=32,cols=16;
  const c=document.createElement('canvas'); c.width=cw*cols; c.height=ch;
  const x=c.getContext('2d'); x.clearRect(0,0,c.width,c.height);
  x.fillStyle='#fff'; x.font='bold 26px monospace'; x.textAlign='center'; x.textBaseline='middle';
  const hex='0123456789abcdef';
  for(let i=0;i<16;i++) x.fillText(hex[i], i*cw+cw/2, ch/2+1);
  glyphTex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,glyphTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
}
function buildAddrTex(){
  const a=(WALLET||'').toLowerCase().replace(/[^0-9a-f]/g,'');
  const s=(a.length?a:'0').padEnd(40,'0').slice(0,40);
  const c=document.createElement('canvas'); c.width=40; c.height=1;
  const x=c.getContext('2d'); const img=x.createImageData(40,1);
  for(let i=0;i<40;i++){ const ch=s.charCodeAt(i); const nib=(ch<=57)?ch-48:ch-87; img.data[i*4]=Math.round(nib/15*255); img.data[i*4+3]=255; }
  x.putImageData(img,0,0);
  if(!addrTex) addrTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,addrTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  glyphAddr=WALLET;
}
function drawShaderTunnel(t) {
  if (!gl) return;
  let P = stProg[activeShaderTunnel];
  if (P === undefined) {
    try {
      const pr = gl.createProgram();
      gl.attachShader(pr, compileShader(gl.VERTEX_SHADER, ST_VS));
      gl.attachShader(pr, compileShader(gl.FRAGMENT_SHADER, SHADER_TUNNELS[activeShaderTunnel]));
      gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
      P = { pr: pr, aP: gl.getAttribLocation(pr, 'aP'), u: {} };
      const us = ['uT','uR','uC0','uC1','uC2','uC3','uWp','uSpd','uDen','uAtlas','uAddrTex'];
      for (let i = 0; i < us.length; i++) P.u[us[i]] = gl.getUniformLocation(pr, us[i]);
      stProg[activeShaderTunnel] = P;
    } catch (e) { console.error('shader tunnel failed:', e); stProg[activeShaderTunnel] = null; }
  }
  if (!P) {   // compile failed on this device — fall back to a geometry tunnel
    activeShaderTunnel = null;
    setTunnelShape('hex');
    return;
  }
  if (!stBuf) {
    stBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, stBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  }
  gl.useProgram(P.pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, stBuf);
  gl.enableVertexAttribArray(P.aP);
  gl.vertexAttribPointer(P.aP, 2, gl.FLOAT, false, 0, 0);
  const c0 = hexRGB(palette[0]), c1 = hexRGB(palette[1]), c2 = hexRGB(palette[2]), c3 = hexRGB(palette[3] || '#0a0a14');
  gl.uniform1f(P.u.uT, t);
  gl.uniform2f(P.u.uR, W, H);
  gl.uniform3f(P.u.uC0, c0[0], c0[1], c0[2]);
  gl.uniform3f(P.u.uC1, c1[0], c1[1], c1[2]);
  gl.uniform3f(P.u.uC2, c2[0], c2[1], c2[2]);
  gl.uniform3f(P.u.uC3, c3[0], c3[1], c3[2]);
  const w1 = (WHEX && WHEX.length >= 8) ? parseInt(WHEX.slice(0, 4), 16) / 65535 : 0.5;
  const w2 = (WHEX && WHEX.length >= 8) ? parseInt(WHEX.slice(4, 8), 16) / 65535 : 0.5;
  gl.uniform2f(P.u.uWp, w1, w2);
  gl.uniform1f(P.u.uSpd, ($('spd') ? $('spd').value : 50) / 100);
  gl.uniform1f(P.u.uDen, ($('den') ? $('den').value : 50) / 100);
  if (P.u.uAtlas) { if (!glyphTex) buildGlyphAtlas(); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, glyphTex); gl.uniform1i(P.u.uAtlas, 1); }
  if (P.u.uAddrTex) { if (!addrTex || glyphAddr !== WALLET) buildAddrTex(); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, addrTex); gl.uniform1i(P.u.uAddrTex, 2); gl.activeTexture(gl.TEXTURE0); }
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function sfc32(a,b,c,d){return function(){a|=0;b|=0;c|=0;d|=0;let t=(a+b|0)+d|0;d=d+1|0;a=b^b>>>9;b=c+(c<<3)|0;c=(c<<21|c>>>11);c=c+t|0;return (t>>>0)/4294967296;};}
function seedFrom(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return [h,h^0xdeadbeef,h^0x1f1f1f1f,h^0x77777777];}

// Utility: tinted hex with alpha
function rgba(hex, a) {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${(v>>16)&0xff},${(v>>8)&0xff},${v&0xff},${a})`;

// Per-glitch state (kept in closures)
const State = {};

// -- 1. Static noise (BUZZ — re-randomizes per frame, true TV static) --
function gStatic(ctx, w, h, pal, t, spd, den, opa) {
  // pre-rendered buzz tiles: cycle through N tiles so the static genuinely jitters
  // without us paying the per-frame ImageData cost every frame
  const tile = 200;
  const TILES = 4;
  if (!State.staticTiles || State.staticTiles.length !== TILES) {
    State.staticTiles = [];
    for (let n = 0; n < TILES; n++) {
      const c = document.createElement('canvas'); c.width = tile; c.height = tile;
      const c2 = c.getContext('2d');
      const img = c2.createImageData(tile, tile);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = Math.random();
        const v = r < 0.45 ? 255 : r < 0.55 ? 200 : 0;
        d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=255;
      }
      c2.putImageData(img, 0, 0);
      State.staticTiles.push(c);
    }
  }
  // pick which tile based on time + speed — feels like buzzing
  const idx = ((t * 1000 * (0.5 + spd * 4)) | 0) % TILES;
  ctx.fillStyle = pal[0]; ctx.fillRect(0,0,w,h);
  ctx.globalAlpha = opa;
  for (let y = 0; y < h; y += tile) {
    for (let x = 0; x < w; x += tile) {
      ctx.drawImage(State.staticTiles[idx], x, y);
    }
  }
  ctx.globalAlpha = 1;
}

// -- 2. Palette static (BUZZ — per-pixel like white static, just colored) --
function gPaletteStatic(ctx, w, h, pal, t, spd, den, opa) {

  const tileKey = pal[1] + '-' + pal[2];
  if (!State.palstaticTiles || State.palstaticKey !== tileKey || State.palstaticTiles.length !== TILES) {
    State.palstaticTiles = [];
    const accent = hexToRgb(pal[1]);
    const mid    = hexToRgb(pal[2]);
    for (let n = 0; n < TILES; n++) {
      const c = document.createElement('canvas'); c.width = tile; c.height = tile;
      const c2 = c.getContext('2d');
      const img = c2.createImageData(tile, tile);
      const d = img.data;
      // per-pixel like white static — smoother, less chunky
      for (let i = 0; i < d.length; i += 4) {
        const r = Math.random();
        let col;
        if (r < 0.55)      col = [0,0,0];
        else if (r < 0.85) col = [accent.r,accent.g,accent.b];
        else               col = [mid.r,mid.g,mid.b];
        d[i]=col[0]; d[i+1]=col[1]; d[i+2]=col[2]; d[i+3]=255;
      }
      c2.putImageData(img, 0, 0);
      State.palstaticTiles.push(c);
    }

// -- 24. Cellular automaton (rule 30 scrolling) — MUCH busier (multiple seeds, finer cells) --

  const cell = 2;                                     // was 3, finer cells = busier
  const cols = Math.ceil(w/cell);

  if (!State.cellRow || State.cellRow.length !== cols) {
    // seed with MULTIPLE on-bits spread across the row instead of just one center
    State.cellRow = new Uint8Array(cols);
    const seeds = 6 + ((cols / 60) | 0);              // ~6-20 seed bits depending on width
    for (let s = 0; s < seeds; s++) {
      State.cellRow[((s + 1) * cols / (seeds + 1)) | 0] = 1;
    }
    State.cellRows = [];
    for (let g = 0; g < maxRows; g++) {
      const row = State.cellRow;
      const nx = new Uint8Array(cols);
      for (let i = 0; i < cols; i++) {

      State.cellRows.push(nx);

    for (let i = 0; i < cols; i++) {
      const l = row[(i-1+cols)%cols], c = row[i], r = row[(i+1)%cols];
      nx[i] = (l ^ (c | r)) & 1;

    State.cellRow = nx;
    State.cellRows.push(nx);
    if (State.cellRows.length > maxRows) State.cellRows.shift();

  for (let y = 0; y < State.cellRows.length; y++) {
    const row = State.cellRows[y];
    const drawY = h - (State.cellRows.length - y) * cell;
    for (let x = 0; x < cols; x++) {

      ctx.fillText(chars[idx], x, y + cellY - 2);
    }
  }
  ctx.globalAlpha = 1;
}

// ===========================================================================
// PRETEXT-POWERED TEXT TUNNELS
// Text wall textures laid out with chenglou/pretext (window.Pretext) for
// accurate multi-line measurement + wrapping, so tokens fill the 256px wall
// edge-to-edge and NOTHING clips off the right edge. (The old fillText address
// wall was unreadable because 42-char strings ran straight off the texture.)
// Wrapping is computed ONCE per seed change and cached in State.txt; each frame
// only scrolls the cached lines, so there is zero per-frame layout cost —
// safe at 60fps including iPhone.
// ===========================================================================
const TEXT_PAD = 6;

// Wallet-responsive hex: when a wallet is loaded, the "random" hex used by every
// address treatment is drawn from THAT wallet's own digits (cycling) — so the
// tunnel literally shows the holder's address. No wallet loaded = random as before.
let WHEX = '';   // wallet's 40 hex chars (no 0x prefix); '' = random mode
let WPTR = 0;    // rolling read pointer into WHEX
function rhex(n) {
  let s = '';
  if (WHEX) { for (let i = 0; i < n; i++) { s += WHEX[WPTR % WHEX.length]; WPTR++; } return s; }
  for (let i = 0; i < n; i++) s += '0123456789abcdef'[(Math.random()*16)|0];
  return s;
}

// Wrap a long string into lines that fit the texture width using pretext.
// prepareOpts (optional) passes pretext options, e.g. { whiteSpace:'pre-wrap' }
// to honour hard \n breaks. Falls back to a naive split for the first frame(s)
// before the pretext module loads (the cache is flagged so it rebuilds once ready).
function wrapToTexture(text, font, lineHeight, prepareOpts, maxWidthOverride) {
  const maxW = maxWidthOverride || (TEX_SIZE - TEXT_PAD * 2);
  const P = window.Pretext;
  if (!P) return (prepareOpts && prepareOpts.whiteSpace === 'pre-wrap') ? text.split('\n') : text.split(/\s+/);
  const prepared = P.prepareWithSegments(text, font, prepareOpts);
  const { lines } = P.layoutWithLines(prepared, maxW, lineHeight);
  // trimEnd: pretext keeps trailing whitespace on a line but (correctly) excludes
  // it from the wrap width; drop it so left-aligned fillText never visually clips.
  return lines.map(l => l.text.trimEnd());
}

// Draw one row with the requested alignment. justify distributes space between
// tokens to hit the full wall width (uses pretext-measured fit via canvas widths).
function drawTextRow(ctx, line, y, maxW, align) {
  if (!line || align === 'left') { ctx.fillText(line, TEXT_PAD, y); return; }
  if (align === 'justify') {
    const toks = line.split(' ').filter(Boolean);
    if (toks.length < 2) { ctx.fillText(line, TEXT_PAD, y); return; }
    let tw = 0; for (let k = 0; k < toks.length; k++) tw += ctx.measureText(toks[k]).width;
    const gap = (maxW - tw) / (toks.length - 1);
    if (gap <= 0 || gap > 48) { ctx.fillText(line, TEXT_PAD, y); return; }  // don't over-stretch sparse rows
    let x = TEXT_PAD;
    for (let k = 0; k < toks.length; k++) { ctx.fillText(toks[k], x, y); x += ctx.measureText(toks[k]).width + gap; }
    return;
  }
  const lw = ctx.measureText(line).width;
  const x = align === 'center' ? TEXT_PAD + (maxW - lw) / 2 : TEXT_PAD + (maxW - lw);  // center | right
  ctx.fillText(line, x, y);
}

// Factory: content-builder + font (+ opts) => a scrolling pretext-laid-out wall.
// opts: { align:'left'|'center'|'right'|'justify', prepare:{...}, rowColor(li,pal,line) }
function makeTextTunnel(id, buildContent, font, lineHeight, opts) {
  opts = opts || {};
  const align = opts.align || 'left';
  return function(ctx, w, h, pal, t, spd, den, opa) {
    if (!State.txt) State.txt = {};
    const slot = State.txt[id] || (State.txt[id] = {});
    const ready = !!window.Pretext;
    const key = id + '|' + SEED;
    if (slot.key !== key || !slot.lines || (slot.fallback && ready)) {
      slot.key = key;
      slot.fallback = !ready;
      slot.lines = wrapToTexture(buildContent(), font, lineHeight, opts.prepare);
    }
    const lines = slot.lines;
    ctx.fillStyle = pal[0]; ctx.fillRect(0, 0, w, h);
    if (!lines.length) { return; }
    ctx.globalAlpha = opa;
    ctx.font = font;
    ctx.textBaseline = 'top';
    const maxW = TEX_SIZE - TEXT_PAD * 2;
    const rowH = lineHeight;
    const total = t * spd * 35;
    const scroll = ((total % rowH) + rowH) % rowH;
    const base = Math.floor(total / rowH);
    const rows = Math.ceil(h / rowH) + 2;
    for (let i = -1; i < rows; i++) {
      const y = i * rowH - scroll;
      const li = (((base + i) % lines.length) + lines.length) % lines.length;
      const line = lines[li];
      ctx.fillStyle = opts.rowColor ? opts.rowColor(li, pal, line) : ((li % 2) ? pal[1] : pal[2]);
      drawTextRow(ctx, line, y, maxW, align);
    }
    ctx.globalAlpha = 1;
  };
}

// Factory: swirling vortex of pretext-laid-out text. Same cached-lines model as
// makeTextTunnel (layout once per seed, only animate per frame), but instead of
// flat scrolling rows it pivots the whole field around the texture centre and
// twists each row by an angle proportional to its distance from centre — a
// whirlpool of addresses. Mapped onto the receding tunnel walls this reads as a
// vortex spinning down the throat of the tunnel.
// opts: { spin, twist, wrapWidth, prepare, rowColor }
function makeTextSwirl(id, buildContent, font, lineHeight, opts) {
  opts = opts || {};
  const spinK  = opts.spin  != null ? opts.spin  : 0.22;   // global rotation rate
  const twistK = opts.twist != null ? opts.twist : 0.0075; // radians per px from centre
  const wrapW  = opts.wrapWidth || Math.round(TEX_SIZE * 1.5); // wider rows reach the corners when spun
  return function(ctx, w, h, pal, t, spd, den, opa) {
    if (!State.txt) State.txt = {};
    const slot = State.txt[id] || (State.txt[id] = {});
    const ready = !!window.Pretext;
    const key = id + '|' + SEED;
    if (slot.key !== key || !slot.lines || (slot.fallback && ready)) {
      slot.key = key;
      slot.fallback = !ready;
      slot.lines = wrapToTexture(buildContent(), font, lineHeight, opts.prepare, wrapW);
    }
    const lines = slot.lines;
    ctx.fillStyle = pal[0]; ctx.fillRect(0, 0, w, h);
    if (!lines.length) { return; }
    ctx.globalAlpha = opa;
    ctx.font = font;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    const rowH = lineHeight;
    const total = t * spd * 35;
    const scroll = ((total % rowH) + rowH) % rowH;
    const base = Math.floor(total / rowH);
    const spin = t * spd * spinK;
    // cover the texture diagonal so the spun field leaves no centre-band gaps
    const half = Math.ceil((Math.SQRT2 * Math.max(w, h)) / rowH / 2) + 2;
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(spin);
    for (let i = -half; i <= half; i++) {
      const ry = i * rowH - scroll;                 // signed offset from centre
      const li = (((base + i) % lines.length) + lines.length) % lines.length;
      const line = lines[li];
      if (!line) continue;
      ctx.save();
      ctx.rotate(ry * twistK);                       // per-row twist → whirlpool
      ctx.fillStyle = opts.rowColor ? opts.rowColor(li, pal, line) : ((li % 2) ? pal[1] : pal[2]);
      ctx.fillText(line, 0, ry);
      ctx.restore();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';                          // reset shared ctx state for other tex fns
    ctx.textBaseline = 'top';
  };
}

// -- content builders (run once per seed, cached) --
const KW = ['FRONTRUN','GAS','NONCE','BLOCK','MEMPOOL','PENDING','0xCONF','1 AHEAD','VANGUARD'];
function contentAddresses() {
  const out = [];
  for (let n = 0; n < 70; n++) {
    const r = Math.random();
    if (r < 0.6)       out.push('0x' + rhex(4) + rhex(4));               // 8-hex chunk
    else if (r < 0.85) out.push('0x' + rhex(4) + rhex(4) + rhex(4) + '…');
    else               out.push(KW[(Math.random()*KW.length)|0]);
  }
  return out.join('  ');
}
const MANIFESTO = ('ALWAYS ONE BLOCK AHEAD. VANGUARD NOT VICTIM. FRONT RUN THE FUTURE. ' +
  'THE GANG PUSHES FORWARD EVER FORWARD. WE DO NOT WAIT FOR THE NEXT BLOCK — WE ARE THE NEXT BLOCK. ').repeat(3);
function contentManifesto() {
  const words = MANIFESTO.split(' ');
  for (let i = 8; i < words.length; i += 9) words.splice(i, 0, '0x' + rhex(6));   // weave hashes through
  return words.join(' ');
}
function contentHexWall() {
  const out = [];
  for (let n = 0; n < 400; n++) out.push(rhex(2));   // dense 2-char pairs
  return out.join(' ');
}
// Wallet roll: one entry per line (hard \n breaks) — truncated 0x…  + ENS names.
const ENS = ['frontrun.eth','vanguard.eth','oneblock.eth','pacer.eth','mempool.eth','gigabrain.eth','nextblock.eth','aheadof.eth','theforward.eth'];
function contentWallet() {
  const out = [];
  for (let i = 0; i < 64; i++) {
    out.push(Math.random() < 0.24 ? ENS[(Math.random()*ENS.length)|0]
                                  : '0x' + rhex(4) + '…' + rhex(4));
  }
  return out.join('\n');
}
// Monolith: a few full addresses chunked into 3-char groups so they wrap huge.
function contentGiant() {
  const out = [];
  for (let a = 0; a < 6; a++) {
    let s = '0x';
    for (let g = 0; g < 13; g++) s += (g ? ' ' : '') + rhex(3);
    out.push(s);
  }
  return out.join('  ');
}

// 2. Wallet roll: one truncated address / ENS name per centered line (pre-wrap \n).

// 5. Matrix rain, but every column is a falling ETH address — read a column
//    top-to-bottom and you get "0x…" cascading. Bright head, fading tail.
function colAddr() { return '0x' + rhex(3 + ((Math.random() * 38) | 0)); }
function gAddrMatrix_tex(ctx, w, h, pal, t, spd, den, opa) {
  ctx.fillStyle = pal[0]; ctx.fillRect(0, 0, w, h);
  ctx.globalAlpha = opa;
  const colW = 13, rowH = 15, cols = Math.ceil(w / colW), trail = 11;
  if (!State.addrMatrix || State.addrMatrix.length !== cols) {
    State.addrMatrix = [];
    for (let i = 0; i < cols; i++) State.addrMatrix.push({ y: Math.random() * h, spd: 1 + Math.random() * 3, s: colAddr() });
  }
  ctx.font = 'bold 14px monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  for (let i = 0; i < cols; i++) {
    const c = State.addrMatrix[i];
    c.y += c.spd * (0.5 + spd);
    if (c.y - trail * rowH > h) { c.y = -((Math.random() * h) | 0); c.s = colAddr(); }
    const headRow = (c.y / rowH) | 0;
    for (let j = 0; j < trail; j++) {
      const row = headRow - j, ty = row * rowH;
      if (ty > -rowH && ty < h) {
        const a = j === 0 ? 1 : (1 - j / trail) * 0.8;
        ctx.globalAlpha = opa * a;
        ctx.fillStyle = j === 0 ? pal[2] : pal[1];
        ctx.fillText(c.s[((row % c.s.length) + c.s.length) % c.s.length], i * colW, ty);
      }
    }
  }
  ctx.globalAlpha = 1;
}

// 6. Ribbon: ONE continuous address string spiralling from centre outward — a
//    single swirling line of text that *is* the tunnel. Spins + scrolls in place.
function ribbonContent() {
  let out = '';
  for (let n = 0; n < 160; n++) out += '0x' + rhex(4 + ((Math.random() * 6) | 0)) + '  ';
  return out;
}
function gAddrRibbon_tex(ctx, w, h, pal, t, spd, den, opa) {
  ctx.fillStyle = pal[0]; ctx.fillRect(0, 0, w, h);
  if (!State.ribbon || State.ribbonKey !== SEED) { State.ribbonKey = SEED; State.ribbon = ribbonContent(); }
  const s = State.ribbon, n = s.length;
  ctx.globalAlpha = opa;
  ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cx = w / 2, cy = h / 2;
  const b = 4.4;                                       // radius gain per radian (spiral tightness)
  const rmax = Math.SQRT2 * Math.max(w, h) / 2 + 14;
  const spin = t * spd * 0.5;
  const scroll = (t * spd * 7) | 0;
  let theta = 0.7, r = 9, i = 0;
  while (r < rmax && i < 4000) {
    const ang = theta + spin;
    const ch = s[(((i + scroll) % n) + n) % n];
    if (ch !== ' ') {
      ctx.save();
      ctx.translate(cx + r * Math.cos(ang), cy + r * Math.sin(ang));
      ctx.rotate(ang + Math.PI / 2);
      ctx.fillStyle = (i % 2) ? pal[1] : pal[2];
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    }
    theta += 10 / r;                                   // advance ~one char width along the arc
    r = 9 + b * theta;
    i++;
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
}

// 7. Fluid smoke — ASCII-fluid sim (technique from somnai-dreams/pretext-demos
//    "fluid-smoke"): a density grid advected through a procedural curl field,
//    orbiting emitters inject smoke, density→glyph via a brightness-sorted ramp.
//    Here the ramp is built from hex/address glyphs, so the smoke IS addresses.
const SMOKE_CHARS = " .:-=+*x0123456789abcdef#";
let SMOKE_PAL = null;
function smokeMeasure(ch) {
  const m = State._smokeM || (State._smokeM = (function () {
    const cv = document.createElement('canvas'); cv.width = cv.height = 24;
    return cv.getContext('2d', { willReadFrequently: true });
  })());
  m.clearRect(0, 0, 24, 24); m.font = 'bold 14px monospace'; m.fillStyle = '#fff';
  m.textBaseline = 'middle'; m.fillText(ch, 2, 12);
  const d = m.getImageData(0, 0, 24, 24).data; let sum = 0;
  for (let k = 3; k < d.length; k += 4) sum += d[k];
  return sum / (255 * 576);
}
function buildSmokePalette() {
  const arr = [];
  for (const ch of SMOKE_CHARS) { if (ch === ' ') continue; arr.push({ ch, b: smokeMeasure(ch) }); }
  const max = Math.max.apply(null, arr.map(p => p.b)) || 1;
  for (const p of arr) p.b /= max;
  arr.sort((a, b) => a.b - b.b);
  return arr;
}
function gAddrSmoke_tex(ctx, w, h, pal, t, spd, den, opa) {
  ctx.fillStyle = pal[0]; ctx.fillRect(0, 0, w, h);
  if (!SMOKE_PAL) SMOKE_PAL = buildSmokePalette();
  const CELL = 11, COLS = Math.max(8, (w / CELL) | 0), ROWS = Math.max(8, (h / CELL) | 0);
  let S = State.smoke;
  if (!S || S.COLS !== COLS || S.ROWS !== ROWS) {
    S = State.smoke = {
      COLS, ROWS, den: new Float32Array(COLS * ROWS), tmp: new Float32Array(COLS * ROWS),
      em: [ { cx: .28, cy: .42, r: .14, f: .30, p: 0,   s: .40 },
            { cx: .70, cy: .34, r: .10, f: .25, p: 2.1, s: .34 },
            { cx: .46, cy: .66, r: .16, f: .35, p: 4.2, s: .44 },
            { cx: .80, cy: .60, r: .08, f: .40, p: 1.0, s: .32 } ]
    };
  }
  const dens = S.den, tmp = S.tmp, em = S.em;
  const tt = t * (0.6 + spd);                          // sim time scaled by speed slider
  // 1) advect: semi-Lagrangian backtrace on a layered-sine curl field
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const nx = c / COLS, ny = r / ROWS;
    const vx = Math.sin(ny * 6.28 + tt * 0.3) * 2 + Math.cos((nx + ny) * 12.5 + tt * 0.55) * 0.7;
    const vy = Math.cos(nx * 5 + tt * 0.4) * 1.5 + Math.sin((nx - ny) * 10 + tt * 0.4) * 0.8;
    let sx = c - vx; if (sx < 0) sx = 0; else if (sx > COLS - 1.001) sx = COLS - 1.001;
    let sy = r - vy; if (sy < 0) sy = 0; else if (sy > ROWS - 1.001) sy = ROWS - 1.001;
    const x0 = sx | 0, y0 = sy | 0, x1 = Math.min(x0 + 1, COLS - 1), y1 = Math.min(y0 + 1, ROWS - 1);
    const fx = sx - x0, fy = sy - y0;
    tmp[r * COLS + c] = dens[y0 * COLS + x0] * (1 - fx) * (1 - fy) + dens[y0 * COLS + x1] * fx * (1 - fy)
                      + dens[y1 * COLS + x0] * (1 - fx) * fy + dens[y1 * COLS + x1] * fx * fy;
  }
  dens.set(tmp);
  // 2) light diffusion (smoke softening)
  tmp.set(dens);
  for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++) {
    const i = r * COLS + c;
    tmp[i] = dens[i] * 0.9 + (dens[i - 1] + dens[i + 1] + dens[i - COLS] + dens[i + COLS]) * 0.025;
  }
  dens.set(tmp);
  // 3) emitters inject density (slider raises strength)
  const spread = 3;
  for (let e = 0; e < em.length; e++) {
    const E = em[e];
    const ec = ((E.cx + Math.cos(tt * E.f + E.p) * E.r) * COLS) | 0;
    const er = ((E.cy + Math.sin(tt * E.f * 0.7 + E.p) * E.r * 0.8) * ROWS) | 0;
    for (let dr = -spread; dr <= spread; dr++) for (let dc = -spread; dc <= spread; dc++) {
      const rr = er + dr, cc = ec + dc;
      if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
        const fall = 1 - Math.sqrt(dr * dr + dc * dc) / (spread + 1);
        if (fall > 0) { const idx = rr * COLS + cc; dens[idx] = Math.min(1, dens[idx] + fall * E.s * (0.5 + den)); }
      }
    }
  }
  // 4) decay (slow — lets smoke cores billow and linger)
  for (let i = 0; i < COLS * ROWS; i++) dens[i] *= 0.991;
  // 5) render: density → address glyph
  ctx.font = 'bold 13px monospace'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  const N = SMOKE_PAL.length;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const b = dens[r * COLS + c];
    if (b < 0.04) continue;
    let gi = Math.round(b * (N - 1)); if (gi < 0) gi = 0; else if (gi >= N) gi = N - 1;
    ctx.fillStyle = b > 0.62 ? pal[2] : pal[1];
    ctx.globalAlpha = opa * Math.min(1, 0.35 + b);
    ctx.fillText(SMOKE_PAL[gi].ch, c * CELL + CELL / 2, r * CELL + CELL / 2);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
}

  { name: 'oct + RGB walls + mirror',       palette:'0', shape:'oct',         tex:'rgbsplit',      glitch:'mirror',    spd:'50', den:'55', figSize:'92', figOpa:'100' },
  { name: 'twelve + circles walls',         palette:'0', shape:'twelve',      tex:'circles_tex',   glitch:'flood',     spd:'50', den:'50', figSize:'92', figOpa:'100' },
  { name: 'pentagon + halftone walls',      palette:'0', shape:'pentagon',    tex:'halftone_tex',  glitch:'invert',    spd:'50', den:'60', figSize:'92', figOpa:'100' },
  { name: 'twisted + radial walls',         palette:'0', shape:'twisted',     tex:'radial_tex',    glitch:'tear',      spd:'50', den:'50', figSize:'92', figOpa:'100' },
  { name: 'hex recursive (hextun walls)',   palette:'0', shape:'hex',         tex:'hextun_tex',    glitch:'glitchtext',spd:'50', den:'50', figSize:'92', figOpa:'100' },
  { name: 'square + concentric walls',      palette:'0', shape:'square',      tex:'concsq_tex',    glitch:'palstatic', spd:'50', den:'50', figSize:'92', figOpa:'100' },
  { name: 'square-flat + diagonal walls',   palette:'0', shape:'square-flat', tex:'diagonal_tex',  glitch:'tear',      spd:'50', den:'50', figSize:'92', figOpa:'100' },
  { name: 'oct + glitchtext walls',         palette:'0', shape:'oct',         tex:'glitchtext',    glitch:'palstatic', spd:'50', den:'50', figSize:'92', figOpa:'100' },
];

function seedStarterLooks() {
  if (loadLooks().length > 0) return; // user already has saved looks — don't overwrite
  persist(STARTER_LOOKS.slice());
}
function renderLooks() {
  const list = $('looks-list'); list.innerHTML = '';
  const looks = loadLooks();
  if (!looks.length) { list.innerHTML='<div style="color:#555;font-size:10px;padding:4px 0">(none yet)</div>'; return; }
  looks.forEach((L,i)=>{
    const row=document.createElement('div'); row.className='row'; row.style.gap='2px';
    const b=document.createElement('button'); b.textContent=L.name; b.title=L.bottom+' / '+L.top;
    b.style.cssText='margin:0;flex:1;text-align:left;font-size:10px;padding:3px 6px';
    b.onclick=()=>restoreLook(L);
    const d=document.createElement('button'); d.textContent='×'; d.style.cssText='margin:0;flex:0 0 22px;color:#666';
    d.onclick=e=>{e.stopPropagation();persist(loadLooks().filter((_,j)=>j!==i));renderLooks();};
    row.appendChild(b); row.appendChild(d); list.appendChild(row);
  });
}
function saveLook(){
  const name=($('look-name').value||'').trim()||('look '+(loadLooks().length+1));
  const L=captureLook(); L.name=name;
  const a=loadLooks(); a.push(L); persist(a); $('look-name').value=''; renderLooks();
}

// ===========================================================================
// PANEL TOGGLE
// ===========================================================================
function togglePanel(){
  const p=$('panel'),t=$('toggle-panel');
  if(p.style.display==='none'){p.style.display='block';t.style.display='none';}
  else{p.style.display='none';t.style.display='block';}
}

// ===========================================================================
// TITLE / FADE  — promo video ending
// Toggle: tunnel dissolves to black while the FRONTRUN wordmark resolves and
// holds. Wordmark colour tracks the live palette accent. Press F again (or Esc)
// to bring the scene back.
// ===========================================================================
function hexToRGBA(hex, a){
  const h = hex.replace('#',''); const n = parseInt(h,16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return `rgba(${r},${g},${b},${a})`;
}
function titleFade(){
  const f = $('frame');
  const accent = palette[1] || '#ED1E79';
  f.style.setProperty('--title-color', accent);
  f.style.setProperty('--title-glow', hexToRGBA(accent, 0.55));
  f.classList.toggle('titled');
}

// ===========================================================================
// BOOT
// ===========================================================================
populateDropdown('fig-glitch', 'palstatic');

$('palette-sel').addEventListener('change', e => {
  palette = PALETTES[+e.target.value];
  buildTunnelTexture();   // texture uses palette colors
});
$('fig-glitch').addEventListener('change', e => activeGlitch = e.target.value);
$('tunnel-shape').addEventListener('change', e => setTunnelShape(e.target.value));
$('flash-mode').addEventListener('change', e => setFlashMode(e.target.value));
$('flash-opa').addEventListener('input', applyFlashOpacity);
$('tunnel-tex').addEventListener('change', e => {
  tunnelTex = e.target.value;
  if (tunnelTex === 'noise') buildTunnelTexture();  // bake static noise once
});
$('fig-opa').addEventListener('input', updateFigure);
$('fig-size').addEventListener('input', applyFigureSize);
$('save-look').addEventListener('click', saveLook);
$('look-name').addEventListener('keydown', e => { if (e.key === 'Enter') saveLook(); });
$('wallet-addr').addEventListener('change', e => applyWallet(e.target.value));
$('wallet-addr').addEventListener('keydown', e => { if (e.key === 'Enter') applyWallet(e.target.value); });

// Promo / screen-recording controls:
//   • Click/tap the image (anywhere outside the panel) → new RANDOM COMBO
//   • Press SPACE or R → new RANDOM COMBO
// Works whether the panel is open or hidden, so you can record and trigger
// fresh looks live. The panel + its [ + ] button are excluded.
document.addEventListener('click', e => {
  if (e.target.closest('#panel, #toggle-panel, #preview-bar')) return; // don't hijack the controls
  if ($('frame').classList.contains('titled')) return;   // don't reroll while the title holds
  if (document.body.classList.contains('preview')) { if (document.body.classList.contains('tap')) rollPreview(); return; } // tap mode: click = new piece
  randomCombo();
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return; // allow typing
  // F → title fade (FRONTRUN wordmark resolves as the tunnel dies). Esc → undo.
  if (e.key === 'f' || e.key === 'F') { e.preventDefault(); titleFade(); return; }
  if (e.key === 'Escape') { e.preventDefault(); $('frame').classList.remove('titled'); return; }
  if (e.code === 'Space' || e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    if (document.body.classList.contains('preview')) rollPreview(); else randomCombo();
  }
});

// WebGL tunnel boot — happens here so PALETTES/SHAPES/palette are all available
setupWebGL();
resize();
activeShape = SHAPES[2]; // default hex
buildTunnelGeometry(activeShape);
buildTunnelTexture();

reseed();
applyFigureSize();
loadFigureMask();
updateFigure();
applyFlashOpacity();                   // sync overlay's bg color to slider value
setFlashMode($('flash-mode').value);   // activate flash if dropdown defaults to a non-off option
seedStarterLooks();    // pre-load curated combos if none saved yet
renderLooks();
frame();

// PUBLIC PREVIEW MODE — activate when URL has ?preview (or ?clean):
//   hides the dev panel entirely, shows only the minimal wallet bar + art.
//   ?w=0x… loads a specific wallet (shareable links); otherwise rolls one.
(function initPreview() {
  const p = new URLSearchParams(location.search);
  if (!(p.has('preview') || p.has('clean'))) return;
  document.body.classList.add('preview');
  if (p.has('embed') || p.has('tap')) document.body.classList.add('embed');   // hide in-iframe bar; the landing page drives it
  if (p.has('tap')) document.body.classList.add('tap');        // ?tap=1 → click anywhere to roll a new piece, no UI
  // let a parent site control the art via postMessage
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'frontrun:wallet') applyPreview(d.value || '');
    else if (d.type === 'frontrun:roll') rollPreview();
    else if (d.type === 'frontrun:ping') postParentState();
    else if (d.type === 'frontrun:piece') {            // full distinct piece from a wallet (palette + look)
      const v = d.value || '';
      seedFromWallet(v); applyWallet(v); syncPreviewURL(v);
      if (d.shape) { setTunnelShape(d.shape); const ss = $('tunnel-shape'); if (ss) ss.value = d.shape; } // flipper: lock one effect
      const i = $('preview-addr'); if (i) i.value = v.trim();
      postParentState();
    }
  });
  const inp = $('preview-addr');
  if (inp) {
    // apply the moment a complete address/ENS is pasted or typed — no Enter needed
    inp.addEventListener('input', e => {
      const v = e.target.value.trim();
      if (/^0x[0-9a-fA-F]{40}$/.test(v) || /\.eth$/i.test(v)) applyPreview(v);
    });
    inp.addEventListener('change', e => applyPreview(e.target.value));   // blur / commit fallback
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyPreview(e.target.value); inp.blur(); } });
  }
  // locked look preset: ?look=bwstatic → B&W static walls + solid-black silhouette
  if (p.get('look') === 'bwstatic') {
    const bw = PALETTES.length - 1;
    $('palette-sel').value = bw; palette = PALETTES[bw];
    setTunnelShape('square-flat');
    $('tunnel-tex').value = 'static'; tunnelTex = 'static';
    $('fig-glitch').value = 'solidblack'; activeGlitch = 'solidblack';
    buildTunnelTexture(); updateFigure();
    return;
  }
  const w = p.get('w');
  if (w) { seedFromWallet(w); applyWallet(w); if (inp) inp.value = w; }
  else rollPreview();    // never start blank
  // ?shape=liquidmetal|blackwater|towers|canary — force a tunnel (showcase / shareable links)
  const _shp = p.get('shape');
  if (_shp) { setTunnelShape(_shp); const _ss=$('tunnel-shape'); if(_ss) _ss.value=_shp; }
})();
</script>
</body>
</html>
