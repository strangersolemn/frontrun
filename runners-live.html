<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRONTRUN · runners on the real art</title>
<style>
  :root{--bg:#08080c;--fg:#eaeaf0;--mut:#8a8a96;--line:#1c1c24;--acc:#ED1E79}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,Menlo,monospace;
    display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 16px}
  h1{font-size:15px;letter-spacing:.2em;text-transform:uppercase;margin:0}
  .tag{color:var(--mut);font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:2px 0 12px}
  .stage{position:relative;width:min(92vw,560px);aspect-ratio:1;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#000}
  #art{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .traits{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12px}
  .chip b{color:var(--mut);font-weight:400;margin-right:6px;text-transform:uppercase;font-size:10px;letter-spacing:.1em}
  .ctrls{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px;align-items:center}
  button{font:inherit;border-radius:10px;padding:12px 14px;cursor:pointer;border:1px solid #33333f;background:#15151d;color:var(--fg)}
  button:hover:not(.on){border-color:#55556a}
  #roll{flex:1;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .seg{display:flex;gap:6px;flex:1}
  .seg button{flex:1;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .seg button.on{border-color:var(--acc);background:#2a0f1c;color:#fff}
  label.lab{color:var(--mut);font-size:11px;letter-spacing:.1em;text-transform:uppercase;min-width:54px}
  .note{color:var(--mut);font-size:11px;max-width:560px;text-align:center;line-height:1.6}
</style></head><body>
<h1>Runners · on the real art</h1><div class="tag">real tunnel + glitch · rendered into the tier shape</div>
<div class="stage"><iframe id="art" src="./sketch-v4-glitch-lab.html?embed=1&preview=1&fig=front" title="art"></iframe></div>
<div class="traits" id="traits"></div>
<div class="ctrls">
  <div class="row"><button id="roll">🎲 new piece (palette + glitch)</button></div>
  <div class="row"><label class="lab">tier</label>
    <div class="seg" id="tier">
      <button data-t="king">👑 king</button>
      <button data-t="front" class="on">🦸 front</button>
      <button data-t="runner">🏃 pack</button>
    </div>
  </div>
</div>
<div class="note">this is the <b>real on-chain render</b> — the glitch is drawn straight into the tier's silhouette (king / front / pack), over the live tunnel. randomize to see every glitch on each runner.</div>
<script>
const $=id=>document.getElementById(id);
const art=$("art");
const PN=['frontrunner','crimson','emerald','amber','cyan','sulphur','magenta','violet','royal blue','dark red','terminal green','black & white'];
const iwin=()=>{try{return art.contentWindow;}catch(e){return null;}};
const idoc=()=>{try{return art.contentDocument;}catch(e){return null;}};
function curGlitch(){ const d=idoc(); const s=d&&d.getElementById('fig-glitch'); return s?s.value:''; }
function paint(pi){ $("traits").innerHTML='<span class="chip"><b>palette</b>'+(PN[pi]!==undefined?PN[pi]:'—')+'</span><span class="chip"><b>glitch</b>'+(curGlitch()||'—')+'</span>'; }
let PIDX=0;
// pin the engine figure to full size (it defaults to 92% and resets on every roll) so the +10% zoom / leg-crop reads like the race page
function setZoom(){ try{ const d=idoc(); if(d) d.documentElement.style.setProperty('--fig-scale','1.0'); }catch(e){} }
setInterval(setZoom, 500);
addEventListener('message',e=>{ const d=e.data||{}; if(d.type==='frontrun:state'){ if(typeof d.palette==='number') PIDX=d.palette; paint(PIDX); setZoom(); } });
art.addEventListener('load',()=>{ setTimeout(()=>{ try{iwin().postMessage({type:'frontrun:ping'},'*');}catch(e){} paint(PIDX); setZoom(); },700); });
$("roll").onclick=()=>{ try{iwin().postMessage({type:'frontrun:roll'},'*');}catch(e){} setTimeout(()=>paint(PIDX),500); };
$("tier").querySelectorAll('button').forEach(b=>b.onclick=()=>{
  try{iwin().postMessage({type:'frontrun:figset',value:b.dataset.t},'*');}catch(e){}
  $("tier").querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
});
</script></body></html>
