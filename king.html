<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRONTRUN · the king</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#000;color:#eaeaf0;font:14px/1.5 ui-monospace,Menlo,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  .cap{letter-spacing:.24em;text-transform:uppercase;font-size:12px;color:#8a8a96}
  .cap b{color:#eaeaf0}
  #king{width:min(88vw,460px);height:auto;display:block;image-rendering:auto}
</style></head><body>
<div class="cap">FRONTRUN · <b>the king</b></div>
<img id="king" alt="the king running">
<div class="cap" id="col"></div>
<script>
const COLS=[['magenta','king-gifs/king_magenta.gif'],['cyan','king-gifs/king_cyan.gif'],
            ['gold','king-gifs/king_gold.gif'],['emerald','king-gifs/king_green.gif']];
// preload
COLS.forEach(c=>{const i=new Image();i.src=c[1];});
let k=0; function show(){ const c=COLS[k%COLS.length]; document.getElementById('king').src=c[1]+'?'+k;
  document.getElementById('col').textContent='colour · '+c[0]; k++; }
show(); setInterval(show, 3500);
</script></body></html>
