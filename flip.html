<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRONTRUN — flip</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:monospace;color:#ccc}
  #art{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #catch{position:fixed;inset:0;z-index:5;cursor:pointer}
  #hud{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:10;
       display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.72);
       border:1px solid #333;padding:8px 12px;font-size:12px;letter-spacing:.06em;backdrop-filter:blur(6px)}
  #hud b{color:#ED1E79}
  #hud button{background:#181818;border:1px solid #444;color:#ccc;font:inherit;font-size:12px;
              padding:6px 11px;cursor:pointer}
  #hud button.on{background:#ED1E79;border-color:#ED1E79;color:#fff}
  #hud button:hover{border-color:#ED1E79}
  #keys{position:fixed;right:14px;top:12px;z-index:10;font-size:10px;color:#666;text-align:right;line-height:1.7;letter-spacing:.08em}
</style>
</head>
<body>
  <iframe id="art" src="./sketch-v4-glitch-lab.html?preview=1&embed=1&canary=1" title="FRONTRUN"></iframe>
  <div id="catch"></div>
  <div id="hud">
    <button id="prev">‹ prev</button>
    <button id="next">next ›</button>
    <button id="auto">▶ auto</button>
    <button id="slower">–</button>
    <span><b id="spd">1.5</b>s</span>
    <button id="faster">+</button>
  </div>
  <div id="keys">SPACE / click — next<br>A — autoplay&nbsp;&nbsp;[ ] — speed<br>H — hide UI</div>
<script>
  const art = document.getElementById('art');
  const post = (type,value) => art.contentWindow && art.contentWindow.postMessage(value?{type,value}:{type}, '*');

  // history so prev works
  const hist = []; let hpos = -1;
  function randWallet(){ let a='0x'; for(let i=0;i<40;i++) a+='0123456789abcdef'[(Math.random()*16)|0]; return a; }
  function newPiece(){ const w=randWallet(); hist.length=hpos+1; hist.push(w); hpos=hist.length-1; post('frontrun:piece', w); }
  function prevPiece(){ if(hpos>0){ hpos--; post('frontrun:piece', hist[hpos]); } }
  function nextPiece(){ if(hpos<hist.length-1){ hpos++; post('frontrun:piece', hist[hpos]); } else newPiece(); }

  let timer=null, interval=1500;
  const spdEl=document.getElementById('spd'), autoBtn=document.getElementById('auto');
  function setSpd(ms){ interval=Math.max(200,Math.min(6000,ms)); spdEl.textContent=(interval/1000).toFixed(1);
    if(timer){ clearInterval(timer); timer=setInterval(newPiece, interval); } }
  function toggleAuto(){ if(timer){ clearInterval(timer); timer=null; autoBtn.classList.remove('on'); autoBtn.textContent='▶ auto'; }
    else { timer=setInterval(newPiece, interval); autoBtn.classList.add('on'); autoBtn.textContent='⏸ auto'; } }

  document.getElementById('next').onclick = nextPiece;
  document.getElementById('prev').onclick = prevPiece;
  document.getElementById('catch').onclick = nextPiece;
  autoBtn.onclick = toggleAuto;
  document.getElementById('slower').onclick = ()=>setSpd(interval+300);
  document.getElementById('faster').onclick = ()=>setSpd(interval-300);

  // hide UI for clean capture
  let hidden=false;
  function setUI(h){ hidden=h; document.getElementById('hud').style.display=h?'none':'flex'; document.getElementById('keys').style.display=h?'none':'block'; }

  addEventListener('keydown', e=>{
    const k=e.key.toLowerCase();
    if(k===' '||k==='arrowright'){ e.preventDefault(); nextPiece(); }
    else if(k==='arrowleft'){ e.preventDefault(); prevPiece(); }
    else if(k==='a'){ toggleAuto(); }
    else if(k===']'){ setSpd(interval-300); }
    else if(k==='['){ setSpd(interval+300); }
    else if(k==='h'){ setUI(!hidden); }
  });

  // kick off once the engine is ready
  setTimeout(newPiece, 1500);
</script>
</body>
</html>
