<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRONTRUN — flip</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:monospace;color:#ccc}
  #art{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #catch{position:fixed;inset:0;z-index:5;cursor:pointer}
  #bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;
       display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:96vw}
  #bar button{background:rgba(0,0,0,.72);border:1px solid #444;color:#bbb;font:inherit;font-size:12px;
              letter-spacing:.08em;text-transform:uppercase;padding:9px 13px;cursor:pointer;backdrop-filter:blur(6px)}
  #bar button.on{background:#ED1E79;border-color:#ED1E79;color:#fff}
  #bar button:hover{border-color:#ED1E79}
  #hint{position:fixed;left:0;right:0;top:16px;text-align:center;z-index:10;font-size:11px;letter-spacing:.18em;color:#777}
</style>
</head>
<body>
  <iframe id="art" src="./sketch-v4-glitch-lab.html?preview=1&embed=1&canary=1" title="FRONTRUN"></iframe>
  <div id="catch"></div>
  <div id="hint">click / space — next &nbsp;·&nbsp; H — hide</div>
  <div id="bar"></div>
<script>
  const EFFECTS = [
    ['','all'],
    ['liquidmetal','liquid metal'],
    ['blackwater','black water'],
    ['towers','towers'],
    ['datastream','datastream'],
    ['datacity','database city'],
    ['whirlwind','whirlwind'],
    ['troncity','tron city'],
    ['barcode','barcode'],
    ['ticker','ticker'],
    ['rain','matrix rain'],
    ['dreamweaver','dreamweaver ★'],
    ['canary','liquid gold ⛧'],
  ];
  let effect = '';
  const art = document.getElementById('art'), bar = document.getElementById('bar');
  function randWallet(){ let a='0x'; for(let i=0;i<40;i++) a+='0123456789abcdef'[(Math.random()*16)|0]; return a; }
  function flip(){
    const msg = { type:'frontrun:piece', value:randWallet() };
    if (effect) msg.shape = effect;
    art.contentWindow && art.contentWindow.postMessage(msg, '*');
  }
  EFFECTS.forEach(([id,name])=>{
    const b=document.createElement('button'); b.textContent=name; b.dataset.id=id;
    if(id==='') b.classList.add('on');
    b.onclick=()=>{ effect=id; Array.from(bar.children).forEach(x=>x.classList.toggle('on',x.dataset.id===id)); flip(); };
    bar.appendChild(b);
  });
  document.getElementById('catch').onclick = flip;

  let hidden=false;
  addEventListener('keydown', e=>{
    const k=e.key.toLowerCase();
    if(k===' '){ e.preventDefault(); flip(); }
    else if(k==='h'){ hidden=!hidden; bar.style.display=hidden?'none':'flex'; document.getElementById('hint').style.display=hidden?'none':'block'; }
  });

  setTimeout(flip, 1500);   // first piece once the engine boots
</script>
</body>
</html>
